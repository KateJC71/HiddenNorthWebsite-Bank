<!DOCTYPE html>
<html lang="zh-Hant" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品後台｜Hidden North</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/symbol-color.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="adm">
  <!-- login -->
  <div id="gate" class="adm-gate">
    <form id="gate-form" style="width:100%;max-width:340px;text-align:center">
      <img src="assets/symbol-color.svg" alt="" width="46" height="46" style="margin:0 auto 20px">
      <h1 class="serif" style="font-size:22px;letter-spacing:.08em;margin:0 0 6px">商品後台</h1>
      <p class="admin-note" style="margin:0 0 20px">請輸入管理密碼</p>
      <label for="gate-pass" class="sr-only">密碼</label>
      <input class="input" id="gate-pass" type="password" autocomplete="current-password" placeholder="密碼">
      <p class="err-msg" id="gate-err" style="text-align:left"></p>
      <button class="btn btn--primary btn--block" type="submit" id="gate-btn" style="margin-top:12px">登入</button>
    </form>
  </div>

  <div class="admin-wrap" id="admin" hidden>
    <div class="admin-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="assets/symbol-color.svg" alt="" width="30" height="30">
        <strong style="font-family:var(--sans-ui);letter-spacing:.06em">商品後台</strong>
        <span class="badge" id="mode-badge"></span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn--outline adm-btn" id="btn-add">＋ 新增商品</button>
        <button class="btn btn--outline adm-btn" id="btn-reload">重新載入</button>
        <button class="btn btn--outline adm-btn" id="btn-export" hidden>匯出 tours.json</button>
        <button class="btn btn--primary adm-btn" id="btn-publish" disabled>發佈到網站</button>
      </div>
    </div>

    <div id="status" class="adm-status" aria-live="polite"></div>

    <div class="admin-cols">
      <div>
        <div class="admin-list" id="tour-list"></div>
        <p class="admin-note" style="margin-top:12px">「草稿」不會出現在網站上。改好後按右上角「發佈到網站」，約 1 分鐘後生效。</p>
      </div>
      <div id="editor"></div>
    </div>
  </div>

  <script src="tour-schema.js"></script>
  <script src="admin.js"></script>
</body>
</html>
