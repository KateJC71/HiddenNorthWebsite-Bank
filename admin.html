<!DOCTYPE html>
<html lang="zh-Hant" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行程後台｜Hidden North</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/symbol-color.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- passcode gate -->
  <div id="gate" style="position:fixed;inset:0;background:var(--snow);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px">
    <form id="gate-form" style="width:100%;max-width:340px;text-align:center">
      <img src="assets/symbol-color.svg" alt="" width="46" height="46" style="margin:0 auto 20px">
      <h1 class="serif" style="font-size:22px;letter-spacing:.08em;margin:0 0 6px">行程後台</h1>
      <p class="admin-note" style="margin:0 0 20px">請輸入管理密碼</p>
      <input class="input" id="gate-pass" type="password" autocomplete="current-password" placeholder="密碼">
      <p class="err-msg" id="gate-err" style="text-align:left"></p>
      <button class="btn btn--primary btn--block" type="submit" style="margin-top:12px">進入</button>
    </form>
  </div>

  <div class="admin-wrap" id="admin" hidden>
    <div class="admin-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="assets/symbol-color.svg" alt="" width="30" height="30">
        <strong style="font-family:var(--sans-ui);letter-spacing:.06em">行程後台</strong>
        <span class="badge" id="count-badge" style="font-size:11px">—</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn--outline" id="btn-add" style="min-height:42px;padding:11px 18px">＋ 新增行程</button>
        <button class="btn btn--outline" id="btn-reload" style="min-height:42px;padding:11px 18px">重新載入</button>
        <button class="btn btn--outline" id="btn-copy" style="min-height:42px;padding:11px 18px">複製 JSON</button>
        <button class="btn btn--primary" id="btn-export" style="min-height:42px;padding:11px 18px">匯出 tours.json</button>
      </div>
    </div>

    <p class="notice" style="margin-bottom:22px">
      編輯後請按「匯出 tours.json」下載檔案，覆蓋專案中的 <code>data/tours.json</code> 後 push（Vercel 會自動重新部署）。
      編輯中的內容會暫存於此瀏覽器。
    </p>

    <div class="admin-cols">
      <div>
        <div class="admin-list" id="tour-list"></div>
      </div>
      <div class="admin-editor" id="editor">
        <p class="admin-note">請從左側選擇行程，或新增一筆。</p>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
